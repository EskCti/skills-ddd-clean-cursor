interface:
  display_name: 'Requirement Discovery'
  short_description: 'Analisar sistema existente (qualquer linguagem) e documentar requisitos em DDD/Clean Architecture'
  default_prompt: 'Analise o sistema fornecido (URL ou caminho local) e extraia requisitos, BCs, entidades e regras de negocio em DDD/Clean Architecture. Obrigatorio: mapear superficies de entrega (painel web, mobile, so API) e gerar delivery-inventory.md agrupando telas/rotas por area de negocio; screens.md se via browser. Gere tambem requirements.md, ddd-analysis.md e domain-model.md em docsPath/discovery/nome-do-sistema/. Proximo passo: req-ddd-modeling; depois delivery-profile.md + req-agile-planning (backlog full-stack com tasks Vue/Android por camada, nao so backend).'
