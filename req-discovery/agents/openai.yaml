interface:
  display_name: 'Requirement Discovery'
  short_description: 'Analisar sistema existente (qualquer linguagem) e documentar requisitos em DDD/Clean Architecture'
  default_prompt: 'Analise o sistema fornecido (URL ou caminho local — pode ser qualquer linguagem/arquitetura: PHP MVC, Go, Python, Java, monolito, etc.) e extraia os requisitos funcionais e não-funcionais. Mapeie telas, endpoints, entidades, regras de negócio, integrações e perfis de acesso. Traduza os conceitos encontrados para DDD/Clean Architecture (Bounded Contexts, Entities, Value Objects, Use Cases, Repositories). Gere requirements.md, ddd-analysis.md, screens.md (se via browser) e domain-model.md em <docsPath>/discovery/<nome-do-sistema>/ (docsPath vem de skills.config.json, fallback: docs). Use diagramas ASCII. Ao final, ofereça organizar em planejamento ágil via req-agile-planning (tasks referenciam skills TS, KT ou CS deste repositório).'
