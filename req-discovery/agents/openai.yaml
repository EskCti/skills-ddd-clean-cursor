interface:
  display_name: 'Requirement Discovery'
  short_description: 'Analisar sistema existente (qualquer linguagem) e documentar requisitos em DDD/Clean Architecture'
  default_prompt: 'Analise o sistema fornecido (URL ou caminho local — pode ser qualquer linguagem/arquitetura: PHP MVC, Go, Python, Java, monolito, etc.) e extraia os requisitos funcionais e nao-funcionais. Mapeie telas, endpoints, entidades, regras de negocio, integracoes e perfis de acesso. Traduza os conceitos encontrados para DDD/Clean Architecture (Bounded Contexts, Entities, Value Objects, Use Cases, Repositories). Gere requirements.md, ddd-analysis.md, screens.md (se via browser) e domain-model.md em docsPath/discovery/nome-do-sistema/ (docsPath vem de skills.config.json, fallback: docs). Use diagramas ASCII. Ao final, ofereca aprofundar a modelagem DDD via req-ddd-modeling (subdominios, context map, linguagem ubiqua) ou organizar em planejamento agil via req-agile-planning (tasks referenciam skills TS, KT ou CS deste repositorio).'
