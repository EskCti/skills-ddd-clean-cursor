interface:
  display_name: 'DDD Modeling'
  short_description: 'Modelagem DDD estrategica e tatica sobre requisitos levantados'
  default_prompt: 'Aplique o Roadmap DDD (Estrategico, Tatico, Operacional) sobre os requisitos fornecidos. Na fase estrategica, identifique o dominio, subdominios (Core/Supporting/Generic), bounded contexts com cardinalidade (1:1, 1:N, N:1), construa o context map com relacoes tipadas e documente a linguagem ubiqua por contexto. Na fase tatica, para cada BC identifique Value Objects, Entities, Aggregates, Domain Services, Domain Events e Repository ports. Na fase operacional, recomende topologia (monolito modular vs microservicos) e mapeie artefatos para skills TS/KT/CS. Gere ddd-strategic-model.md, ddd-tactical-model.md e ddd-operational-notes.md em docsPath/modeling/nome-do-projeto/ (docsPath vem de skills.config.json, fallback: docs). Use diagramas ASCII. Ao final, ofereca gerar planejamento agil via req-agile-planning.'
