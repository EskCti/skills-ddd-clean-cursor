interface:
  display_name: 'DDD Modeling'
  short_description: 'Modelagem DDD estrategica e tatica sobre requisitos levantados'
  default_prompt: 'Aplique o Roadmap DDD (Estrategico, Tatico, Operacional) sobre os requisitos fornecidos. Na fase estrategica, identifique o dominio, subdominios, bounded contexts, context map e linguagem ubiqua. Na fase tatica, por BC: modelo de dominio (VOs, Entities, Aggregates, Domain Services, Events, Repository ports), Superficies de entrega (API|Web|Mobile) e, quando Web ou Mobile = Sim, secoes Apresentacao (rotas/telas, guards/menu, entidades e use cases de UI no cliente) conforme references/client-presentation-model.md — ler delivery-inventory.md se existir. Na fase operacional, topologia e mapeamento para skills TS/KT/CS. Gere ddd-strategic-model.md, ddd-tactical-model.md e ddd-operational-notes.md em docsPath/modeling/nome-do-projeto/. Ao final, ofereca delivery-profile e req-agile-planning com subsecoes Telas e fluxos por US.'
