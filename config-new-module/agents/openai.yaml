interface:
  display_name: 'Config New Module'
  short_description: 'Criar módulo full-stack (package + backend + frontend)'
  default_prompt: 'Crie um novo módulo com node .agents/skills/config-new-module/scripts/create-module.mjs gerando package compartilhado, módulo backend com provider Prisma e modelo Prisma, módulo frontend com dashboard/menu e rota em app/(private), criando `layout.tsx` do módulo em `app/(private)/<module>` com menu lateral embutido usando `PrivateAppShell` (de `modules/auth/template/private-app-shell.component.tsx`), menu padrão (Voltar, separador, label do módulo e `Visão Geral <Nome do Módulo>`), garantindo labels dos menus com acentuação correta em PT-BR quando aplicável, `EmptyDashboardState` como padrão de dashboard quando disponível e `moduleName` opcional para o título do dashboard, sincronize a dependência <scope>/<modulo> em apps/backend/package.json e apps/web/package.json, atualize o menu principal em `app/(private)/dashboard/layout.tsx` com entrada do módulo em `moduleItems` (incluindo ícone determinístico), e ao final aplique ordenação semântica determinística por frequência de uso com módulos administrativos no bloco inferior. Não depender de arquivos data/*-menu.data.ts nem *-navigation.component.tsx para o menu lateral.'
