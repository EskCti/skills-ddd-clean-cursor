interface:
  display_name: 'Config New Module'
  short_description: 'Criar módulo full-stack (package + backend + frontend)'
  default_prompt: 'Crie um novo módulo com node .agents/skills/config-new-module/scripts/create-module.mjs gerando package compartilhado, módulo backend com provider Prisma e modelo Prisma, módulo frontend com dashboard/menu e rota em app/(private), sempre criando `<module>-navigation.component.tsx` em `modules/<module>/components` e `layout.tsx` do módulo em `app/(private)/<module>` para decidir localmente o menu do módulo usando `PrivateAppShell` (de `modules/auth/template/private-app-shell.component.tsx`), com componente compartilhado de padronização em `shared/navigation/module-sidebar-menu.component.tsx`, menu padrão (Voltar, separador, label do módulo e `Visão Geral <Nome do Módulo>`), garantindo labels dos menus com acentuação correta em PT-BR quando aplicável, `EmptyDashboardState` como padrão de dashboard quando disponível e `moduleName` opcional para o título do dashboard, sincronize a dependência <scope>/<modulo> em apps/backend/package.json e apps/web/package.json, atualize o registro central do menu principal em `app/(private)/dashboard/_data/main-menu-modules.json` com item navegável e ícone determinístico, e ao final aplique ordenação semântica determinística por frequência de uso com módulos administrativos no bloco inferior.'
