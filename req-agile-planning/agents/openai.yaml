interface:
  display_name: 'Agile Planning'
  short_description: 'Organizar requisitos em epicos, stories e tasks DDD com agent Cursor e prompt sugerido'
  default_prompt: 'Organize os requisitos fornecidos (ddd-strategic-model.md + ddd-tactical-model.md do req-ddd-modeling, ou requirements.md + ddd-analysis.md do req-discovery, ou descricao livre, ou URL de issues) em um backlog agil alinhado a DDD/Clean Architecture. Use o modelo estrategico (subdominios, BCs, context map) como base para epicos quando disponivel. Crie epicos a partir dos Bounded Contexts, quebre em user stories Como/Quero/Para com criterios Given/When/Then, decomponha em tasks tecnicas por camada DDD (domain:, app:, infra:, interface:, test:). EP-000 [TECH] deve incluir bootstrap full-stack com config-docker e config-cicd no setup. Para frontend/mobile use camadas completas: interface:entity, interface:usecase, interface:repository, interface:page/form e mobile-* equivalentes. Incluir por story: test:unit, test:coverage (>=95% domain+application via test-unit-*) e test:e2e (fluxos criticos via test-e2e-*; Playwright se UI). IMPORTANTE: para cada task tecnica, incluir OBRIGATORIAMENTE: (1) o nome exato do agent Cursor a acionar (display_name do agents/openai.yaml do skill correspondente) e (2) um prompt sugerido especifico. Se o usuario ja definiu a stack (TS, KT ou CS), usar apenas o agent da stack escolhida. Consultar references/agile-patterns.md. Gere backlog.md e epics-summary.md. Valide epicos com o usuario. Ao final, ofereca openspec-propose bootstrap-<nome> ou implementacao direta.'
