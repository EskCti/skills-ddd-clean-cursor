interface:
  display_name: 'Agile Planning'
  short_description: 'Organizar requisitos em epicos, stories e tasks DDD com referencia a skills TS/KT/CS'
  default_prompt: 'Organize os requisitos fornecidos (ddd-strategic-model.md + ddd-tactical-model.md do req-ddd-modeling, ou requirements.md + ddd-analysis.md do req-discovery, ou descricao livre, ou URL de issues) em um backlog agil alinhado a DDD/Clean Architecture. Use o modelo estrategico (subdominios, BCs, context map) como base para epicos quando disponivel. Crie epicos a partir dos Bounded Contexts, quebre em user stories Como/Quero/Para com criterios Given/When/Then, decomponha em tasks tecnicas por camada DDD (domain:, app:, infra:, interface:, test:) com referencia ao skill TS (sem sufixo), KT (-kt) ou CS (-cs). Estime com Fibonacci e priorize com MoSCoW. Gere backlog.md e epics-summary.md. Valide epicos com o usuario antes de detalhar stories. Ao final, ofereca openspec-propose para implementar.'
