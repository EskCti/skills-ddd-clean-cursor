interface:
  display_name: 'Agile Planning'
  short_description: 'Organizar requisitos em épicos, stories e tasks DDD com referência a skills TS/KT/CS'
  default_prompt: 'Organize os requisitos fornecidos (arquivo requirements.md, ddd-analysis.md, descrição livre ou URL de issues) em um backlog ágil alinhado a DDD/Clean Architecture. Crie épicos a partir dos Bounded Contexts identificados, quebre em user stories no formato Como/Quero/Para com critérios de aceitação Given/When/Then, decomponha em tasks técnicas por camada DDD (domain:, app:, infra:, interface:, test:) com referência ao skill de implementação deste repositório (TS sem sufixo, KT com -kt ou CS com -cs). Estime com Fibonacci e priorize com MoSCoW. Gere backlog.md e epics-summary.md em <docsPath>/planning/<nome-do-projeto>/ (docsPath vem de skills.config.json, fallback: docs). Valide a estrutura de épicos com o usuário antes de detalhar stories. O sistema fonte pode ter sido analisado em qualquer linguagem — as tasks sempre referenciam skills TS, KT ou CS. Ao final, ofereça integração com openspec-propose para iniciar implementação.'
