interface:
  display_name: 'Agile Planning'
  short_description: 'Organizar requisitos em epicos, stories e tasks DDD com agent Cursor e prompt sugerido'
  default_prompt: 'ANTES do backlog: delivery-profile.md (stack + API/Web/Mobile por BC). Ler ddd-tactical-model.md com Apresentacao Web/Mobile por BC (req-ddd-modeling). Por US com web/mobile: subsecoes OBRIGATORIAS Telas e fluxos (web) e/ou (mobile) alinhadas ao modelo de apresentacao; depois tasks inside-out (backend + interface:entity->...->page + mobile-entity->...). PROIBIDO US so controller+page ou Template full-stack em uma linha. EP-000 bootstrap. Testes unit/e2e + test:unit-web/mobile. Cada task: Agent + Prompt. Gere backlog.md, epics-summary.md.'
