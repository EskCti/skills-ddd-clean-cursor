interface:
  display_name: 'Migration Strategy'
  short_description: 'Definir estrategia de migracao de sistema legado para DDD/Clean Architecture'
  default_prompt: 'Defina a estrategia de migracao do sistema legado para a nova arquitetura DDD/Clean Architecture. Use os artefatos do req-discovery (ddd-analysis.md, requirements.md) e/ou req-ddd-modeling (ddd-strategic-model.md) como entrada. Diagnostique o estado do legado (cobertura de testes, acoplamento, banco compartilhado). Escolha o padrao de migracao (Strangler Fig recomendado para sistemas em producao; Big Bang apenas para sistemas pequenos). Desenhe a Anti-Corruption Layer (ACL) para os BCs que precisam integrar com o legado durante a transicao. Defina a sequencia de migracao priorizando BCs Generic (menor risco), depois Supporting, depois Core. Gere migration-strategy.md e acl-design.md em docsPath/migration/nome-do-projeto/ (docsPath vem de skills.config.json, fallback: docs). Ao final, ofereca gerar o backlog de migracao via req-agile-planning.'
